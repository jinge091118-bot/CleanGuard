<style>
:root {
  --bg: #ffffff;
  --fg: #1b1b1f;
  --muted: #5b5b66;
  --line: #e3e3e8;
  --accent: #2f5fd0;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14141a; --fg: #e8e8ee; --muted: #a5a5b2; --line: #2c2c36; --accent: #8fb0ff; }

* { box-sizing: border-box; }
body {

  padding: 3rem 1.25rem;

h1 { font-size: 1.9rem; margin: 0 0 .4rem; letter-spacing: -.015em; }
p.tagline { color: var(--muted); margin: 0 0 2.5rem; }
ul { list-style: none; padding: 0; margin: 0; }
li {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 1rem 1.15rem;
  margin-bottom: .75rem;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.title { font-weight: 650; font-size: 1.05rem; }
.desc { color: var(--muted); font-size: .9rem; margin-top: .2rem; }
footer {
  margin-top: 3rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--line);
